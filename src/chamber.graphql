# Chamber event queries (Ponder 0.8: limit / items, not first / skip)

query GetApprovalEvents($limit: Int, $owner: String, $spender: String) {
  chamber_Approvals(where: { owner: $owner, spender: $spender }, limit: $limit, orderBy: "id", orderDirection: "desc") {
    items {
      id
      owner
      spender
      value
    }
  }
}

query GetConfirmTransactionEvents($limit: Int, $tokenId: BigInt) {
